---
name: Docker Build & Publish

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*.*.*'
      - '*.*.*.*'
  pull_request:
    branches:
      - master
  # Weekly rebuild of the published image from an unchanged master.
  #
  # The image is otherwise only ever rebuilt when someone pushes code, so between two
  # TeamPass releases it keeps shipping the OS packages frozen at the last build while
  # Alpine publishes security fixes for them. Nothing rescans it either, so the Trivy
  # alerts only grow. This run rebuilds and rescans the same source, which is what makes
  # those alerts close on their own.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A release pushes master and the tag in one go, and publishing the GitHub
# Release used to fire a third build of the very same commit. The `release`
# trigger is gone (the tag push already covers it) and the two remaining runs
# are serialized, so they no longer race to overwrite the shared sha-<short>
# tag with two different digests of identical content.
concurrency:
  group: docker-publish-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_DOCKERHUB: teampass/teampass
  IMAGE_NAME_GHCR: ghcr.io/${{ github.repository_owner }}/teampass

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write

    steps:
      # ----------------------------------------
      # Checkout code
      # ----------------------------------------
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ----------------------------------------
      # Resolve the application version from the source
      # ----------------------------------------
      # github.ref_name is the branch name on a branch build, so the image
      # published as :latest used to carry TEAMPASS_VERSION=master and
      # org.opencontainers.image.version=master. app/config/include.php is the
      # single source of truth the entrypoint itself reads, so use it here too
      # and every image reports the version it actually contains.
      - name: Resolve TeamPass version
        id: tpversion
        run: |
          set -euo pipefail
          major=$(sed -n "s/.*define('TP_VERSION',[[:space:]]*'\([^']*\)').*/\1/p" app/config/include.php)
          minor=$(sed -n "s/.*define('TP_VERSION_MINOR',[[:space:]]*'\([^']*\)').*/\1/p" app/config/include.php)
          if [ -z "$major" ] || [ -z "$minor" ]; then
            echo "Could not read TP_VERSION / TP_VERSION_MINOR from app/config/include.php" >&2
            exit 1
          fi
          echo "version=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "Resolved TeamPass version: ${major}.${minor}"

      # ----------------------------------------
      # Set up build environment
      # ----------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # ----------------------------------------
      # Login to registries
      # ----------------------------------------
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Extract metadata (tags, labels)
      # ----------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: step-security/metadata-action@21378f5b76c96c69ac34d21cc3873d85e26381b1 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_NAME_DOCKERHUB }}
            ${{ env.IMAGE_NAME_GHCR }}
          # TeamPass versions carry four digits (3.2.1.7), which is not valid semver,
          # so the three semver patterns below never match a release tag and silently
          # produce nothing. The raw ref_name entry publishes the tag name verbatim,
          # so the versioned image exists and can be pinned.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            # Not on the weekly rebuild: that run republishes the SAME commit with newer
            # OS packages, so it would move sha-<short> to a different digest and break
            # the one tag whose whole purpose is to pin a commit to a fixed image. The
            # rebuild refreshes the mutable tags (latest, master) and nothing else.
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}
          labels: |
            org.opencontainers.image.title=TeamPass
            org.opencontainers.image.description=Collaborative Passwords Manager
            org.opencontainers.image.vendor=TeamPass
            org.opencontainers.image.url=https://teampass.net
            org.opencontainers.image.documentation=https://documentation.teampass.net
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.version=${{ steps.tpversion.outputs.version }}

      # ----------------------------------------
      # Build and push Docker image
      # ----------------------------------------
      - name: Build and push Docker image
        id: build-and-push
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The weekly rebuild exists to replace the OS packages of an unchanged source.
          # The layer cache would hand back the exact packages it is meant to replace -
          # the `apk upgrade` layer hashes to the same key - and the base image would be
          # reused from cache rather than re-pulled, so the run would publish an identical
          # image and close nothing. Both are disabled for that event only, so ordinary
          # pushes keep their fast cached builds.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
          build-args: |
            TEAMPASS_VERSION=${{ steps.tpversion.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}

      # ----------------------------------------
      # Generate SBOM (Software Bill of Materials)
      # ----------------------------------------
      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: step-security/sbom-action@28bb7d0d2869c9ab0e5571c93591747945819d39 # v0.24.2
        with:
          image: ${{ env.IMAGE_NAME_DOCKERHUB }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      # ----------------------------------------
      # Security scanning with Trivy
      # ----------------------------------------
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: step-security/trivy-action@4d04e2d32ba36aae5693467644b22741d68f9115 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME_DOCKERHUB }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: 'trivy-results.sarif'

      # ----------------------------------------
      # Create release notes
      # ----------------------------------------
      - name: Create release summary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME_DOCKERHUB }}:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME_GHCR }}:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Digest" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.build-and-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ----------------------------------------
  # Test the built image
  # ----------------------------------------
  test-image:
    name: Test Docker Image
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    # The job only checks out the repository and pulls the image that
    # build-and-push published, so read access to the contents is all it needs.
    permissions:
      contents: read

    # Add MariaDB service to allow the entrypoint to succeed
    services:
      db:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: teampass
          MARIADB_USER: teampass
          MARIADB_PASSWORD: teampass_password
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and test image
        run: |
          FULL_SHA="${{ github.sha }}"
          SHORT_TAG="${FULL_SHA:0:7}"
          SHA_SHORT_TAG="sha-$SHORT_TAG"
          docker pull ${{ env.IMAGE_NAME_DOCKERHUB }}:"$SHA_SHORT_TAG"
          
          # Run container within the GitHub Actions service network
          # Pass required DB environment variables to satisfy the entrypoint
          docker run --rm \
            --network ${{ job.container.network }} \
            -e DB_HOST=db \
            -e DB_USER=teampass \
            -e DB_PASSWORD=teampass_password \
            -e DB_NAME=teampass \
            ${{ env.IMAGE_NAME_DOCKERHUB }}:"$SHA_SHORT_TAG" php -v

      - name: Test nginx version
        run: |
          FULL_SHA="${{ github.sha }}"
          SHORT_TAG="${FULL_SHA:0:7}"
          SHA_SHORT_TAG="sha-$SHORT_TAG"
          docker run --rm \
            --network ${{ job.container.network }} \
            -e DB_HOST=db \
            -e DB_USER=teampass \
            -e DB_PASSWORD=teampass_password \
            -e DB_NAME=teampass \
            ${{ env.IMAGE_NAME_DOCKERHUB }}:"$SHA_SHORT_TAG" nginx -v
